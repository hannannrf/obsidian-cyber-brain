<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Brain — live demo</title>
<meta name="description" content="Live demo of Cyber Brain, an Obsidian plugin that renders a vault as a rotating holographic brain. Data: one real semester of course notes (titles and links only).">
<meta property="og:title" content="Cyber Brain — an Obsidian vault as a holographic brain">
<meta property="og:description" content="205 real notes and 450 real links, rendered in 3D on a plain 2D canvas. Drag to orbit, hover to lock on, click to fire a signal.">
<meta property="og:image" content="https://hannannrf.github.io/obsidian-cyber-brain/media/cyber-brain.gif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: #04050b; color: #9ff3ff; overflow: hidden; }
  .workspace-leaf-content { position: fixed; inset: 0; }
  .view-content { width: 100%; height: 100%; }
  .demo-links { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .demo-links a {
    font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; color: #9ff3ff;
    text-decoration: none; border: 1px solid rgba(0, 229, 255, 0.35); border-radius: 4px; padding: 4px 10px;
  }
  .demo-links a:hover { background: rgba(0, 229, 255, 0.08); border-color: rgba(0, 229, 255, 0.7); }
  .demo-links a:focus-visible { outline: 1px solid #00e5ff; outline-offset: 2px; }
  .demo-note {
    font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; color: rgba(160, 230, 245, 0.6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .demo-toast {
    position: fixed; left: 50%; top: 64px; transform: translate(-50%, -8px); opacity: 0;
    font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; color: #e8fbff;
    background: rgba(4, 8, 16, 0.92); border: 1px solid rgba(0, 229, 255, 0.5); border-left: 3px solid #00e5ff;
    padding: 8px 14px; pointer-events: none; transition: opacity 160ms ease-out, transform 160ms ease-out;
    max-width: calc(100vw - 32px);
  }
  .demo-toast.is-on { opacity: 1; transform: translate(-50%, 0); }
  .cyber-brain-toolbar button, .demo-links a { white-space: nowrap; }
  @media (max-width: 720px) {
    .demo-note { display: none; }
    .cyber-brain-toolbar { gap: 6px; padding: 8px; }
    .cyber-brain-toolbar button, .demo-links a { font-size: 11px; padding: 4px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .demo-toast { transition: none; } }
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Cyber Brain live demo: an Obsidian vault rendered as a rotating 3D brain</h1>
<div class="workspace-leaf-content" data-type="cyber-brain-view"><div class="view-content" id="vc"></div></div>
<div class="demo-toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="font-family:monospace;padding:24px">This demo needs JavaScript.</p></noscript>
<script>
  /* Minimal stand-in for the Obsidian API so the real plugin code runs in a browser. */
  (function () {
    var P = HTMLElement.prototype;
    P.empty = function () { while (this.firstChild) this.removeChild(this.firstChild); };
    P.createEl = function (tag, o) {
      o = o || {};
      var el = document.createElement(tag);
      if (o.cls) el.className = o.cls;
      if (o.text) el.textContent = o.text;
      if (o.attr) for (var k in o.attr) el.setAttribute(k, o.attr[k]);
      this.appendChild(el); return el;
    };
    P.createDiv = function (o) { return this.createEl('div', o); };
    P.createSpan = function (o) { return this.createEl('span', o); };
    P.setText = function (t) { this.textContent = t; };
    P.addClass = function (c) { this.classList.add(c); };
    P.removeClass = function (c) { this.classList.remove(c); };
    P.toggleClass = function (c, v) { this.classList.toggle(c, v); };
    P.isShown = function () { return !!this.offsetParent || this.getClientRects().length > 0; };

    var ICONS = {
      'refresh-cw': '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M8 16H3v5"/>',
      pause: '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
      play: '<polygon points="6 3 20 12 6 21 6 3"/>'
    };
    function setIcon(el, name) {
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
    }
    function ItemView(leaf) { this.leaf = leaf; this.app = leaf.app; this.contentEl = leaf.contentEl; }
    ItemView.prototype.registerDomEvent = function (el, t, cb, o) { el.addEventListener(t, cb, o); };
    function Noop() {}
    var api = { ItemView: ItemView, Plugin: Noop, PluginSettingTab: Noop, Setting: Noop, TFolder: Noop,
      setIcon: setIcon, debounce: function (f) { return f; } };
    window.require = function () { return api; };
    window.module = { exports: {} };
  })();
</script>
<script src="../main.js"></script>
<script>
  (async function () {
    var toastEl = document.getElementById('toast'), toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('is-on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2600);
    }

    var data = await (await fetch('vault.json')).json();
    var app = {
      vault: {
        getMarkdownFiles: function () { return data.files.map(function (p) { return { path: p }; }); },
        getName: function () { return 'BS SE'; },
        adapter: { getBasePath: function () { return 'D:/BS SE'; } }
      },
      metadataCache: { resolvedLinks: data.resolvedLinks, on: function () {} },
      workspace: { on: function () {}, openLinkText: async function () {} }
    };

    // Boot the real plugin class, capturing its view factory.
    var Plugin = module.exports, factory = null;
    var plugin = Object.create(Plugin.prototype);
    plugin.app = app;
    plugin.loadData = async function () { return {}; };
    plugin.saveData = async function () {};
    plugin.registerView = function (t, f) { factory = f; };
    plugin.addRibbonIcon = plugin.addCommand = plugin.addSettingTab = plugin.registerEvent = function () {};
    app.vault.on = function () {};
    await plugin.onload();

    var view = factory({ app: app, contentEl: document.getElementById('vc') });

    // In Obsidian a click opens the note; here it fires the same signal the plugin fires on file-open.
    view.openNote = function (path) {
      view.renderer.firePath(path, 3);
      var name = path.split('/').pop().replace(/\.md$/, '');
      toast('Opened "' + name + '" — signal fired along its links');
    };
    await view.onOpen();

    var bar = document.querySelector('.cyber-brain-toolbar');
    var note = bar.createSpan({ cls: 'demo-note', text: 'Real data: one semester of course notes (titles and links only). Drag to orbit · scroll to zoom · click a node.' });
    var links = bar.createDiv({ cls: 'demo-links' });
    links.createEl('a', { text: 'Source on GitHub', attr: { href: 'https://github.com/hannannrf/obsidian-cyber-brain' } });
    void note;
    window.cyberBrainView = view;
  })().catch(function (e) {
    console.error(e);
    document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;bottom:12px;left:12px;font-family:monospace;color:#ff2e97">Demo failed to load: ' + String(e).replace(/</g, '&lt;') + '</p>');
  });
</script>
</body>
</html>
